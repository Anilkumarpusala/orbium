<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C85A32" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Default SEO — overridden by React SEOHead per route -->
    <title>ORBIUM — Independent Digital Studio</title>
    <meta name="description" content="Orbium is a premium independent digital studio specializing in web design, development, SEO, and digital growth for ambitious businesses." />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ORBIUM" />
    <meta property="og:title" content="ORBIUM — Independent Digital Studio" />
    <meta property="og:description" content="Orbium is a premium independent digital studio specializing in web design, development, SEO, and digital growth for ambitious businesses." />

    <!-- Twitter defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ORBIUM — Independent Digital Studio" />
    <meta name="twitter:description" content="Orbium is a premium independent digital studio specializing in web design, development, SEO, and digital growth for ambitious businesses." />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ORBIUM",
      "description": "Premium independent digital studio specializing in web design, development, SEO, and digital growth.",
      "url": "https://orbium.studio",
      "email": "hello@orbium.studio",
      "founder": {
        "@type": "Person",
        "name": "Ani McQueen"
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ORBIUM",
      "url": "https://orbium.studio"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
